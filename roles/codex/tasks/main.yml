---
# ── Prerequisites check ──

- name: Check if nvm is available
  stat:
    path: "{{ user_home }}/.nvm/nvm.sh"
  register: nvm_available

- name: Fail if nvm is not installed (run nodejs role first)
  fail:
    msg: "nvm is not installed. Run the nodejs role first: ansible-playbook site.yml --tags nodejs"
  when: not nvm_available.stat.exists

- name: Check if uvx is available (needed for fetch MCP)
  command: which uvx
  register: uv_available
  changed_when: false
  failed_when: false

# ── Install Codex CLI ──

- name: Check if codex is installed
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    npm ls -g @openai/codex 2>/dev/null
  args:
    executable: /bin/bash
  register: codex_check
  changed_when: false
  failed_when: false

- name: Install OpenAI Codex CLI via npm (nvm)
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    npm i -g @openai/codex
  args:
    executable: /bin/bash
  when: codex_check.rc != 0

- name: Update OpenAI Codex CLI via npm when requested
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    npm i -g @openai/codex
  args:
    executable: /bin/bash
  when:
    - codex_check.rc == 0
    - codex_update_enabled | default(false) | bool

# ── MCP servers ──
# Codex stores MCP in ~/.codex/config.toml under [mcp_servers.<name>]

- name: Ensure Codex config directory exists
  file:
    path: "{{ user_home }}/.codex"
    state: directory
    mode: "0700"

- name: Set Codex workspace access defaults and top-level options
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    key="{{ item.key }}"
    value={{ item.value | quote }}
    touch "$config_toml"
    chmod 0600 "$config_toml"
    temp_config="$(mktemp)"
    awk -v key="$key" -v value="$value" '
      BEGIN { in_preamble = 1; setting_seen = 0 }
      in_preamble && /^\[/ {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        in_preamble = 0
      }
      in_preamble && $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        next
      }
      { print }
      END {
        if (in_preamble && !setting_seen) {
          print key " = " value
        }
      }
    ' "$config_toml" >"$temp_config"
    if cmp -s "$temp_config" "$config_toml"; then
      rm -f "$temp_config"
      exit 0
    fi
    python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))' "$temp_config"
    cp "$temp_config" "$config_toml"
    rm -f "$temp_config"
    echo "OK: $key"
  args:
    executable: /bin/bash
  register: codex_top_level_defaults
  changed_when: "'OK:' in codex_top_level_defaults.stdout"
  loop:
    - key: model
      value: '"{{ codex_model | default(''gpt-5.6-terra'') }}"'
    - key: model_reasoning_effort
      value: '"{{ codex_model_reasoning_effort | default(''medium'') }}"'
    - key: model_verbosity
      value: '"{{ codex_model_verbosity | default(''low'') }}"'
    - key: service_tier
      value: '"{{ codex_service_tier | default(''default'') }}"'
    - key: sandbox_mode
      value: '"{{ codex_sandbox_mode | default(''workspace-write'') }}"'
    - key: approval_policy
      value: '"{{ codex_approval_policy | default(''on-request'') }}"'
    - key: approvals_reviewer
      value: '"{{ codex_approvals_reviewer | default(''auto_review'') }}"'
    - key: check_for_update_on_startup
      value: "{{ (codex_check_for_update_on_startup | default(true) | bool) | ternary('true', 'false') }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set Codex runtime table defaults
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    section="[{{ item.table }}]"
    key="{{ item.key }}"
    value={{ item.value | quote }}
    touch "$config_toml"
    temp_config="$(mktemp)"
    awk -v section="$section" -v key="$key" -v value="$value" '
      BEGIN { in_section = 0; section_seen = 0; setting_seen = 0 }
      $0 == section {
        in_section = 1
        section_seen = 1
        print
        next
      }
      in_section && (/^\[/ || /^# BEGIN FIRSTBOOT CODEX SKILL SELECTION$/) {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        in_section = 0
      }
      # max_threads is the legacy alias of the new concurrency key.
      in_section && key == "max_concurrent_threads_per_session" &&
      $0 ~ /^[[:space:]]*max_threads[[:space:]]*=/ { next }
      in_section && $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        next
      }
      { print }
      END {
        if (in_section && !setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        if (!section_seen) {
          print ""
          print section
          print key " = " value
        }
      }
    ' "$config_toml" >"$temp_config"
    if cmp -s "$temp_config" "$config_toml"; then
      rm -f "$temp_config"
      exit 0
    fi
    python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))' "$temp_config"
    cp "$temp_config" "$config_toml"
    rm -f "$temp_config"
    echo "OK: $section $key"
  args:
    executable: /bin/bash
  register: codex_runtime_table_defaults
  changed_when: "'OK:' in codex_runtime_table_defaults.stdout"
  loop:
    - table: apps._default
      key: default_tools_approval_mode
      value: '"{{ codex_apps_default_tools_approval_mode | default(''writes'') }}"'
    - table: apps._default
      key: destructive_enabled
      value: "{{ (codex_apps_destructive_enabled | default(false) | bool) | ternary('true', 'false') }}"
    - table: apps._default
      key: open_world_enabled
      value: "{{ (codex_apps_open_world_enabled | default(false) | bool) | ternary('true', 'false') }}"
    - table: apps._default
      key: approvals_reviewer
      value: '"user"'
    - table: agents
      key: max_concurrent_threads_per_session
      value: '{{ codex_max_concurrent_subagents | default(2) }}'
    - table: agents
      key: max_depth
      value: '1'
    - table: agents
      key: default_subagent_model
      value: '"{{ codex_lean_profile_model | default(''gpt-5.6-terra'') }}"'
    - table: agents
      key: default_subagent_reasoning_effort
      value: '"{{ codex_lean_profile_reasoning_effort | default(''medium'') }}"'
  loop_control:
    label: "{{ item.table }} {{ item.key }}"

- name: Remove misplaced Codex top-level settings from Codex-owned tables
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    temp_config="$(mktemp)"
    awk '
      /^\[/ { section = $0 }
      section ~ /^\[(notice\.model_migrations|tui|tui\.model_availability_nux)\]$/ &&
      $0 ~ /^(model|model_reasoning_effort|service_tier|sandbox_mode|approval_policy|approvals_reviewer|check_for_update_on_startup|startup_timeout_sec)[[:space:]]*=/ {
        changed = 1
        next
      }
      { print }
      END {
        if (changed) {
          exit 2
        }
      }
    ' "$config_toml" >"$temp_config"
    rc=$?
    if [[ $rc -eq 2 ]]; then
      python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))' "$temp_config"
      cp "$temp_config" "$config_toml"
      rm -f "$temp_config"
      echo "OK: removed misplaced settings"
      exit 0
    fi
    rm -f "$temp_config"
    exit "$rc"
  args:
    executable: /bin/bash
  register: codex_misplaced_top_level_cleanup
  changed_when: "'OK:' in codex_misplaced_top_level_cleanup.stdout"

- name: Validate Codex config TOML after managed cleanup
  command:
    argv:
      - python3
      - -c
      - "import sys, tomllib; tomllib.load(open(sys.argv[1], 'rb'))"
      - "{{ user_home }}/.codex/config.toml"
  changed_when: false

- name: Read codex config.toml
  slurp:
    src: "{{ user_home }}/.codex/config.toml"
  register: codex_config_raw
  failed_when: false

- name: Set codex config content
  set_fact:
    codex_config: "{{ (codex_config_raw.content | default('') | b64decode) if codex_config_raw.content is defined else '' }}"

- name: Ensure Codex rules directory exists
  file:
    path: "{{ user_home }}/.codex/rules"
    state: directory
    mode: "0700"

# This file is the managed baseline; provisioning resets interactive approvals.
# Backups do not end in .rules and therefore are not loaded by Codex.
- name: Install reviewed Codex rules baseline
  copy:
    src: default.rules
    dest: "{{ user_home }}/.codex/rules/default.rules"
    backup: true
    mode: "0600"

- name: Write Codex permissions example
  copy:
    dest: "{{ user_home }}/.codex/config.permissions.example.toml"
    force: true
    mode: "0644"
    content: |
      # Example only. Copy selected settings to ~/.codex/config.toml when needed.
      model = "gpt-5.6-terra"
      model_reasoning_effort = "medium"
      model_verbosity = "low"
      service_tier = "default"
      sandbox_mode = "workspace-write"
      approval_policy = "on-request"
      approvals_reviewer = "auto_review"
      check_for_update_on_startup = true

      [apps._default]
      default_tools_approval_mode = "writes"
      destructive_enabled = false
      open_world_enabled = false
      approvals_reviewer = "user"

      [sandbox_workspace_write]
      writable_roots = [
        "{{ user_home }}/example"
      ]

- name: Configure Codex skill selection overrides
  blockinfile:
    path: "{{ user_home }}/.codex/config.toml"
    marker: "# {mark} FIRSTBOOT CODEX SKILL SELECTION"
    mode: "0600"
    block: |
      {% for skill_path in codex_disabled_skill_paths | default([]) %}
      [[skills.config]]
      path = "{{ user_home }}/{{ skill_path }}"
      enabled = false
      {% endfor %}

- name: Create Codex CLI profile files
  copy:
    dest: "{{ user_home }}/.codex/{{ item.name }}.config.toml"
    force: true
    mode: "0644"
    content: |
      # Managed by firstboot. Use with: codex --profile {{ item.name }}
      model = "{{ item.model }}"
      model_reasoning_effort = "{{ item.reasoning_effort }}"
      model_verbosity = "{{ item.verbosity }}"
      service_tier = "{{ codex_service_tier | default('default') }}"
      sandbox_mode = "{{ codex_sandbox_mode | default('workspace-write') }}"
      approval_policy = "{{ codex_approval_policy | default('on-request') }}"
      approvals_reviewer = "{{ codex_approvals_reviewer | default('auto_review') }}"
      {% if item.name == 'lean' %}
      web_search = "cached"
      {% endif %}

  loop:
    - name: lean
      model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
      reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
      verbosity: "{{ codex_lean_profile_verbosity | default('low') }}"
    - name: astra
      model: "{{ codex_astra_profile_model | default('gpt-6-astra') }}"
      reasoning_effort: "{{ codex_astra_profile_reasoning_effort | default('medium') }}"
      verbosity: "low"
    - name: deep
      model: "{{ codex_deep_profile_model | default('gpt-5.6-sol') }}"
      reasoning_effort: "{{ codex_deep_profile_reasoning_effort | default('high') }}"
      verbosity: "{{ codex_deep_profile_verbosity | default('medium') }}"
  loop_control:
    label: "{{ item.name }}"
  when: codex_profiles_enabled | default(true) | bool

- name: Remove managed Codex CLI profile files when disabled
  file:
    path: "{{ user_home }}/.codex/{{ item }}.config.toml"
    state: absent
  loop:
    - lean
    - deep
    - astra
  when: not (codex_profiles_enabled | default(true) | bool)

- name: Ensure Codex custom agents directory exists
  file:
    path: "{{ user_home }}/.codex/agents"
    state: directory
    mode: "0700"

- name: Set Codex custom agent definitions
  set_fact:
    codex_custom_agent_definitions:
      - name: explorer-terra
        description: Fast read-only repository exploration and large-file evidence gathering.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Scout", "Mapper", "Triage"'
        instructions: |
          You are a read-only exploration agent. Inspect files, logs, docs, and command output. Do not edit files. Return only decision-relevant findings with file paths, commands used, and uncertainty where evidence is incomplete.
      - name: reviewer-deep
        description: High-reasoning code review focused on bugs, regressions, security risks, and test gaps.
        model: "{{ codex_deep_profile_model | default('gpt-5.6-sol') }}"
        reasoning_effort: "{{ codex_deep_profile_reasoning_effort | default('high') }}"
        sandbox_mode: read-only
        nicknames: '"Reviewer", "Auditor", "Skeptic"'
        instructions: |
          You are a read-only review agent. Prioritize concrete bugs, behavioral regressions, security risks, and missing tests. Cite exact files and lines when possible. Avoid style-only findings unless they block maintainability or correctness.
      - name: docs-researcher
        description: Targeted documentation research for current APIs, SDKs, frameworks, and platform behavior.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Researcher", "Librarian", "Verifier"'
        instructions: |
          You are a documentation research agent. Prefer official docs and configured documentation MCP servers. Return concise guidance with source links, version assumptions, and any gaps that need verification before implementation.
      - name: tester-terra
        description: Fast build, lint, typecheck, and test runner that reports focused failures without editing source.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: workspace-write
        nicknames: '"Runner", "Verifier", "Harness"'
        instructions: |
          You are a verification agent. Run focused build, lint, typecheck, and test commands requested by the parent thread. You may create normal build/test artifacts in the workspace, but do not edit source files. Return commands, exit codes, concise failure summaries, and likely next investigation targets.
      - name: architect-deep
        description: High-reasoning architecture and migration analyst for ambiguous cross-module design decisions.
        model: "{{ codex_deep_profile_model | default('gpt-5.6-sol') }}"
        reasoning_effort: "{{ codex_deep_profile_reasoning_effort | default('high') }}"
        sandbox_mode: read-only
        nicknames: '"Architect", "Planner", "Strategist"'
        instructions: |
          You are a read-only architecture agent. Analyze constraints, coupling, data flow, rollout risk, and tradeoffs. Do not edit files. Return a concise recommendation, alternatives rejected, and concrete files or interfaces that constrain the design.
      - name: knowledge-curator
        description: Read-only project knowledge curator that proposes durable skills or documentation after non-trivial work.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Curator", "Archivist", "Analyst"'
        instructions: |
          You are a read-only knowledge-curation agent. Inspect recent diffs, command results, failure modes, and successful fixes. Do not edit files or create skills. Return only reusable, evidence-backed knowledge-capture candidates using this format:
          Candidate: short title
          Evidence: files, commands, errors, or artifacts that prove this was useful
          Reuse Trigger: when future Codex sessions should remember this
          Recommended Target: skill, AGENTS.md, README, or no action
          Draft Guidance: 3-6 lines of reusable instruction
      - name: improvement-researcher
        description: Read-only external improvement researcher for tooling, process, skills, MCP, and agent workflow updates.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Researcher", "Scout", "Optimizer"'
        instructions: |
          You are a read-only improvement research agent. Search current external information when requested: official docs, primary repositories, release notes, and credible technical posts when primary sources are insufficient. Do not edit files, install tools, change configuration, or create skills. Return ranked, evidence-backed improvement proposals using this format:
          Finding: short title
          Source: link or exact source name
          Why It Matters: concrete benefit
          Fit For This Repo: how it maps to current firstboot scripts, skills, agents, or docs
          Risk Or Cost: security, maintenance, runtime, token, or compatibility concern
          Suggested Next Step: adopt, test, document, defer, or reject

- name: Remove disabled managed Codex custom agents
  file:
    path: "{{ user_home }}/.codex/agents/{{ item.name }}.toml"
    state: absent
  loop: "{{ codex_custom_agent_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    not (codex_custom_agents_enabled | default(true) | bool)
    or item.name not in (codex_custom_agents | default([]))

- name: Create Codex custom agents
  copy:
    dest: "{{ user_home }}/.codex/agents/{{ item.name }}.toml"
    force: true
    mode: "0644"
    content: |
      # Managed by firstboot.
      name = "{{ item.name }}"
      description = "{{ item.description }}"
      model = "{{ item.model }}"
      model_reasoning_effort = "{{ item.reasoning_effort }}"
      sandbox_mode = "{{ item.sandbox_mode }}"
      nickname_candidates = [{{ item.nicknames }}]

      developer_instructions = '''
      {{ item.instructions }}
      '''
  loop: "{{ codex_custom_agent_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - codex_custom_agents_enabled | default(true) | bool
    - item.name in (codex_custom_agents | default([]))

- name: Install managed Codex agent teamwork skill
  copy:
    src: "{{ playbook_dir }}/codex/skills/codex-agent-teamwork/"
    dest: "{{ user_home }}/.codex/skills/codex-agent-teamwork/"
    mode: "0644"
  when: codex_agent_teamwork_skill_enabled | default(true) | bool

- name: Remove managed Codex agent teamwork skill when disabled
  file:
    path: "{{ user_home }}/.codex/skills/codex-agent-teamwork"
    state: absent
  when: not (codex_agent_teamwork_skill_enabled | default(true) | bool)

- name: Set Codex global AGENTS.md teamwork guidance
  blockinfile:
    path: "{{ user_home }}/.codex/AGENTS.md"
    create: true
    marker: "<!-- {mark} FIRSTBOOT CODEX AGENT TEAMWORK -->"
    mode: "0600"
    block: |
      ## Scope and autonomy

      Carry the requested development or debugging task through implementation and focused verification. Use reasonable defaults for reversible in-scope steps; do not re-ask for authorization already given. For analysis or review requests, report evidence without editing unless asked.
      Run workspace reads, edits, builds, tests, and local diagnostics directly in the sandbox. Use workdir for command location and direct argv-style commands where practical. Keep temporary artifacts in the workspace or /tmp; use workspace-local caches when a global cache is blocked. Inspect only the relevant files and bounded log excerpts.
      For multi-repository builds, identify the required neighboring roots; use --add-dir at launch for those authorized paths. A sibling repo is not automatically writable. Use the configured development-tool and SSH allow rules for authorized tasks. Do not request repeated confirmation for git add, ordinary git commit, file editing, compilation, utility installation, tests, debuggers/analysis tools (including gdb), or SSH diagnostics. Prefer workdir over git -C so subcommand rules match. Keep shell/interpreter allow rules scoped.
      Review the full action before using an allowed tool: rm/deletion, git rebase/reset/clean, commit --amend in any argument position, rsync --delete, and destructive commands inside SSH still require authorization. Local prefix rules cannot inspect remote shell strings, later flags, hooks, or build scripts; do not use these forms to bypass a restriction.
      On a sandbox denial, request the smallest required escalation with the exact command and its purpose; auto-review can handle it. AGENTS.md and skills do not grant sandbox permissions. After an auto-review denial, use a materially safer alternative or explain the denial and request the missing authorization.
      When the user requests hardware debugging or flashing, establish the target board, transport, and intended operation once; carry out the authorized sequence without repeating the question. Stop for an ambiguous target, a new device, destructive recovery outside that scope, or changed side effects. Keep credentials out of commands, rules, and logs.
      Ask before external publication, production changes, destructive actions, or cost only when existing authorization does not cover the concrete action. Prepare a reviewable result first. Preserve unrelated user changes. Stop when the acceptance checks pass and report what was actually verified.

      ## Agent and skill budget

      Use a relevant skill when it adds task-specific knowledge. Prefer one workflow skill; do not cascade into planning, TDD, formal review, or knowledge capture for routine edits. Scale tests to behavior and risk, and use existing checks for configuration-only changes.
      Delegate only when a bounded independent subtask can run alongside useful parent work. Start with at most one subagent. Use explorer-terra, docs-researcher, or tester-terra for read-heavy work; reviewer-deep or architect-deep for substantial correctness risks. Add a second agent only for independent verification. Subagents must not spawn agents.
      Give each agent scope, acceptance checks, and a concise requested output. Prefer a self-contained prompt with fork_turns="none" when full history is unnecessary. Wait for all agents before integrating their results. Consult $codex-agent-teamwork only when coordinating complex parallel work; no automatic curator or researcher step.
  when: codex_global_agents_guidance_enabled | default(true) | bool

- name: Remove Codex global AGENTS.md teamwork guidance when disabled
  blockinfile:
    path: "{{ user_home }}/.codex/AGENTS.md"
    marker: "<!-- {mark} FIRSTBOOT CODEX AGENT TEAMWORK -->"
    state: absent
  when: not (codex_global_agents_guidance_enabled | default(true) | bool)

- name: Disable Codex built-in ChatGPT Apps MCP by default
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    codex features disable apps
  args:
    executable: /bin/bash
  register: codex_apps_disable
  changed_when: >-
    'disabled' in (codex_apps_disable.stdout | lower)
    or 'updated' in (codex_apps_disable.stdout | lower)
  when:
    - not (codex_apps_enabled | default(false) | bool)
    - "'apps = false' not in codex_config"

- name: Enable Codex built-in ChatGPT Apps MCP when requested
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    codex features enable apps
  args:
    executable: /bin/bash
  register: codex_apps_enable
  changed_when: >-
    'enabled' in (codex_apps_enable.stdout | lower)
    or 'updated' in (codex_apps_enable.stdout | lower)
  when:
    - codex_apps_enabled | default(false) | bool
    - "'apps = false' in codex_config"

- name: Set desired Codex MCP server allowlist
  set_fact:
    codex_mcp_desired_servers: >-
      {{ ((codex_mcp_allowlist | default([]))
          + (['github'] if (codex_github_mcp_enabled | default(false) | bool) else [])
          + (['serena'] if (codex_serena_enabled | default(false) | bool) else [])
          + (['playwright'] if (codex_playwright_mcp_enabled | default(false) | bool) else []))
         | unique | list }}

- name: Find existing top-level Codex MCP servers
  set_fact:
    codex_mcp_existing_servers: "{{ codex_config | regex_findall('(?m)^\\[mcp_servers\\.([^.\\]]+)\\]\\s*$') | unique | list }}"

- name: Set disabled optional Codex MCP servers
  set_fact:
    codex_mcp_disabled_optional_servers: >-
      {{ ((['github'] if not (codex_github_mcp_enabled | default(false) | bool) else [])
          + (['serena'] if not (codex_serena_enabled | default(false) | bool) else [])
