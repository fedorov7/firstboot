---
# ── Prerequisites check ──

- name: Check if nvm is available
  stat:
    path: "{{ user_home }}/.nvm/nvm.sh"
  register: nvm_available

- name: Fail if nvm is not installed (run nodejs role first)
  fail:
    msg: "nvm is not installed. Run the nodejs role first: ansible-playbook site.yml --tags nodejs"
  when: not nvm_available.stat.exists

- name: Check if uv is available (needed for fetch MCP)
  command: which uv
  register: uv_available
  changed_when: false
  failed_when: false

# ── Install Codex CLI ──

- name: Check if codex is installed
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    npm ls -g @openai/codex 2>/dev/null
  args:
    executable: /bin/bash
  register: codex_check
  changed_when: false
  failed_when: false

- name: Install OpenAI Codex CLI via npm (nvm)
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    npm i -g @openai/codex
  args:
    executable: /bin/bash
  when: codex_check.rc != 0

- name: Update OpenAI Codex CLI via npm when requested
  shell: |
    export NVM_DIR="{{ user_home }}/.nvm"
    . "$NVM_DIR/nvm.sh"
    nvm use {{ node_version }} >/dev/null || exit 1
    npm i -g @openai/codex
  args:
    executable: /bin/bash
  when:
    - codex_check.rc == 0
    - codex_update_enabled | default(false) | bool

# ── MCP servers ──
# Codex stores MCP in ~/.codex/config.toml under [mcp_servers.<name>]

- name: Ensure Codex config directory exists
  file:
    path: "{{ user_home }}/.codex"
    state: directory

- name: Set Codex workspace access defaults and top-level options
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    key="{{ item.key }}"
    value='{{ item.value }}'
    touch "$config_toml"
    chmod 0644 "$config_toml"
    temp_config="$(mktemp)"
    awk -v key="$key" -v value="$value" '
      BEGIN { in_preamble = 1; setting_seen = 0 }
      in_preamble && /^\[/ {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        in_preamble = 0
      }
      in_preamble && $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        next
      }
      { print }
      END {
        if (in_preamble && !setting_seen) {
          print key " = " value
        }
      }
    ' "$config_toml" >"$temp_config"
    if cmp -s "$temp_config" "$config_toml"; then
      rm -f "$temp_config"
      exit 0
    fi
    cp "$temp_config" "$config_toml"
    rm -f "$temp_config"
    echo "OK: $key"
  args:
    executable: /bin/bash
  register: codex_top_level_defaults
  changed_when: "'OK:' in codex_top_level_defaults.stdout"
  loop:
    - key: model
      value: '"{{ codex_model | default(''gpt-5.6-sol'') }}"'
    - key: model_reasoning_effort
      value: '"{{ codex_model_reasoning_effort | default(''high'') }}"'
    - key: service_tier
      value: '"{{ codex_service_tier | default(''default'') }}"'
    - key: sandbox_mode
      value: '"{{ codex_sandbox_mode | default(''workspace-write'') }}"'
    - key: approval_policy
      value: '"{{ codex_approval_policy | default(''on-request'') }}"'
    - key: approvals_reviewer
      value: '"{{ codex_approvals_reviewer | default(''user'') }}"'
    - key: check_for_update_on_startup
      value: "{{ (codex_check_for_update_on_startup | default(true) | bool) | ternary('true', 'false') }}"
  loop_control:
    label: "{{ item.key }}"

- name: Set Codex runtime table defaults
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    section="[{{ item.table }}]"
    key="{{ item.key }}"
    value='{{ item.value }}'
    touch "$config_toml"
    temp_config="$(mktemp)"
    awk -v section="$section" -v key="$key" -v value="$value" '
      BEGIN { in_section = 0; section_seen = 0; setting_seen = 0 }
      $0 == section {
        in_section = 1
        section_seen = 1
        print
        next
      }
      in_section && /^\[/ {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        in_section = 0
      }
      in_section && $0 ~ "^[[:space:]]*" key "[[:space:]]*=" {
        if (!setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        next
      }
      { print }
      END {
        if (in_section && !setting_seen) {
          print key " = " value
          setting_seen = 1
        }
        if (!section_seen) {
          print ""
          print section
          print key " = " value
        }
      }
    ' "$config_toml" >"$temp_config"
    if cmp -s "$temp_config" "$config_toml"; then
      rm -f "$temp_config"
      exit 0
    fi
    cp "$temp_config" "$config_toml"
    rm -f "$temp_config"
    echo "OK: $section $key"
  args:
    executable: /bin/bash
  register: codex_runtime_table_defaults
  changed_when: "'OK:' in codex_runtime_table_defaults.stdout"
  loop:
    - table: apps._default
      key: default_tools_approval_mode
      value: '"{{ codex_apps_default_tools_approval_mode | default(''writes'') }}"'
    - table: apps._default
      key: destructive_enabled
      value: "{{ (codex_apps_destructive_enabled | default(false) | bool) | ternary('true', 'false') }}"
    - table: apps._default
      key: open_world_enabled
      value: "{{ (codex_apps_open_world_enabled | default(false) | bool) | ternary('true', 'false') }}"
    - table: apps._default
      key: approvals_reviewer
      value: '"{{ codex_approvals_reviewer | default(''user'') }}"'
  loop_control:
    label: "{{ item.table }} {{ item.key }}"

- name: Remove legacy Codex agent runtime settings
  replace:
    path: "{{ user_home }}/.codex/config.toml"
    regexp: '(?m)^\[agents\]\nmax_threads\s*=\s*\d+\nmax_depth\s*=\s*\d+\njob_max_runtime_seconds\s*=\s*\d+\n(?:interrupt_message\s*=\s*(?:true|false)\n)?\n?'
    replace: ''

- name: Remove misplaced Codex top-level settings from Codex-owned tables
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    temp_config="$(mktemp)"
    awk '
      /^\[/ { section = $0 }
      section ~ /^\[(notice\.model_migrations|tui|tui\.model_availability_nux)\]$/ &&
      $0 ~ /^(model|model_reasoning_effort|service_tier|sandbox_mode|approval_policy|approvals_reviewer|check_for_update_on_startup|startup_timeout_sec)[[:space:]]*=/ {
        changed = 1
        next
      }
      { print }
      END {
        if (changed) {
          exit 2
        }
      }
    ' "$config_toml" >"$temp_config"
    rc=$?
    if [[ $rc -eq 2 ]]; then
      cp "$temp_config" "$config_toml"
      rm -f "$temp_config"
      echo "OK: removed misplaced settings"
      exit 0
    fi
    rm -f "$temp_config"
    exit "$rc"
  args:
    executable: /bin/bash
  register: codex_misplaced_top_level_cleanup
  changed_when: "'OK:' in codex_misplaced_top_level_cleanup.stdout"

- name: Read codex config.toml
  slurp:
    src: "{{ user_home }}/.codex/config.toml"
  register: codex_config_raw
  failed_when: false

- name: Set codex config content
  set_fact:
    codex_config: "{{ (codex_config_raw.content | default('') | b64decode) if codex_config_raw.content is defined else '' }}"

- name: Ensure Codex rules directory exists
  file:
    path: "{{ user_home }}/.codex/rules"
    state: directory

- name: Remove legacy managed Codex broad shell wrapper rules
  blockinfile:
    path: "{{ user_home }}/.codex/rules/default.rules"
    create: true
    marker: "# {mark} ANSIBLE MANAGED CODEX RULE {{ item }}"
    state: absent
    mode: "0644"
  loop:
    - pwsh

- name: Ensure Codex trusted utility prefix rules
  blockinfile:
    path: "{{ user_home }}/.codex/rules/default.rules"
    create: true
    marker: "# {mark} ANSIBLE MANAGED CODEX RULE {{ item.name }}"
    block: "{{ item.rule }}"
    mode: "0644"
  loop:
    - name: git
      rule: |
        prefix_rule(
            pattern = ["git"],
            decision = "allow",
            justification = "Allow local Git workflows in trusted workspaces without repeated prompts",
            match = ["git status --short"],
            not_match = ["git-lfs status"],
        )
    - name: rg
      rule: |
        prefix_rule(
            pattern = ["rg"],
            decision = "allow",
            justification = "Allow ripgrep workspace searches without repeated prompts",
        )
    - name: fd
      rule: |
        prefix_rule(
            pattern = ["fd"],
            decision = "allow",
            justification = "Allow fd workspace file discovery without repeated prompts",
        )
    - name: bat
      rule: |
        prefix_rule(
            pattern = ["bat"],
            decision = "allow",
            justification = "Allow bat workspace file viewing without repeated prompts",
        )
    - name: eza
      rule: |
        prefix_rule(
            pattern = ["eza"],
            decision = "allow",
            justification = "Allow eza workspace directory listing without repeated prompts",
        )
    - name: delta
      rule: |
        prefix_rule(
            pattern = ["delta"],
            decision = "allow",
            justification = "Allow delta diff viewing without repeated prompts",
        )
    - name: difft
      rule: |
        prefix_rule(
            pattern = ["difft"],
            decision = "allow",
            justification = "Allow difftastic diff viewing without repeated prompts",
        )
    - name: difftastic
      rule: |
        prefix_rule(
            pattern = ["difftastic"],
            decision = "allow",
            justification = "Allow difftastic diff viewing without repeated prompts",
        )
    - name: just
      rule: |
        prefix_rule(
            pattern = ["just"],
            decision = "allow",
            justification = "Allow project Justfile workflows in trusted workspaces without repeated prompts",
        )
    - name: uv-run
      rule: |
        prefix_rule(
            pattern = ["uv", "run"],
            decision = "allow",
            justification = "Allow uv run project commands in trusted workspaces without repeated prompts",
            match = ["uv run python -m pytest"],
            not_match = ["uvx ruff"],
        )
    - name: cmake-build
      rule: |
        prefix_rule(
            pattern = ["cmake", "--build"],
            decision = "allow",
            justification = "Allow trusted CMake workspace builds without repeated prompts",
            match = ["cmake --build --preset=dev-win64 --target format-check -j 4"],
        )
    - name: ctest
      rule: |
        prefix_rule(
            pattern = ["ctest"],
            decision = "allow",
            justification = "Allow trusted CTest workspace test runs without repeated prompts",
            match = ["ctest --preset=dev-win64 --output-on-failure"],
        )
    - name: ninja
      rule: |
        prefix_rule(
            pattern = ["ninja"],
            decision = "allow",
            justification = "Allow trusted Ninja workspace builds without repeated prompts",
            match = ["ninja -C build"],
        )
    - name: meson-compile
      rule: |
        prefix_rule(
            pattern = ["meson", "compile"],
            decision = "allow",
            justification = "Allow trusted Meson workspace builds without repeated prompts",
            match = ["meson compile -C build"],
        )
    - name: meson-test
      rule: |
        prefix_rule(
            pattern = ["meson", "test"],
            decision = "allow",
            justification = "Allow trusted Meson workspace test runs without repeated prompts",
            match = ["meson test -C build"],
        )
    - name: cargo-build
      rule: |
        prefix_rule(
            pattern = ["cargo", "build"],
            decision = "allow",
            justification = "Allow trusted Cargo workspace builds without repeated prompts",
            match = ["cargo build --all-targets"],
        )
    - name: cargo-check
      rule: |
        prefix_rule(
            pattern = ["cargo", "check"],
            decision = "allow",
            justification = "Allow trusted Cargo workspace checks without repeated prompts",
            match = ["cargo check --all-targets"],
        )
    - name: cargo-test
      rule: |
        prefix_rule(
            pattern = ["cargo", "test"],
            decision = "allow",
            justification = "Allow trusted Cargo workspace tests without repeated prompts",
            match = ["cargo test"],
        )
    - name: cargo-clippy
      rule: |
        prefix_rule(
            pattern = ["cargo", "clippy"],
            decision = "allow",
            justification = "Allow trusted Cargo clippy checks without repeated prompts",
            match = ["cargo clippy --all-targets --all-features -- -D warnings"],
        )
    - name: cargo-nextest
      rule: |
        prefix_rule(
            pattern = ["cargo", "nextest"],
            decision = "allow",
            justification = "Allow trusted Cargo nextest runs without repeated prompts",
            match = ["cargo nextest run"],
        )
    - name: python-pytest
      rule: |
        prefix_rule(
            pattern = ["python", "-m", "pytest"],
            decision = "allow",
            justification = "Allow trusted Python pytest runs without repeated prompts",
            match = ["python -m pytest"],
        )
    - name: python3-pytest
      rule: |
        prefix_rule(
            pattern = ["python3", "-m", "pytest"],
            decision = "allow",
            justification = "Allow trusted Python 3 pytest runs without repeated prompts",
            match = ["python3 -m pytest"],
        )
    - name: pytest
      rule: |
        prefix_rule(
            pattern = ["pytest"],
            decision = "allow",
            justification = "Allow trusted pytest runs without repeated prompts",
            match = ["pytest tests"],
        )
    - name: npm-test
      rule: |
        prefix_rule(
            pattern = ["npm", "test"],
            decision = "allow",
            justification = "Allow trusted npm test scripts without repeated prompts",
            match = ["npm test"],
        )
    - name: npm-run-test
      rule: |
        prefix_rule(
            pattern = ["npm", "run", "test"],
            decision = "allow",
            justification = "Allow trusted npm run test scripts without repeated prompts",
            match = ["npm run test"],
        )
    - name: npm-run-build
      rule: |
        prefix_rule(
            pattern = ["npm", "run", "build"],
            decision = "allow",
            justification = "Allow trusted npm run build scripts without repeated prompts",
            match = ["npm run build"],
        )
    - name: npm-run-lint
      rule: |
        prefix_rule(
            pattern = ["npm", "run", "lint"],
            decision = "allow",
            justification = "Allow trusted npm run lint scripts without repeated prompts",
            match = ["npm run lint"],
        )
    - name: probe-rs
      rule: |
        prefix_rule(
            pattern = ["probe-rs"],
            decision = "allow",
            justification = "Allow probe-rs hardware workflows outside sandbox",
        )
    - name: openocd
      rule: |
        prefix_rule(
            pattern = ["openocd"],
            decision = "allow",
            justification = "Allow OpenOCD hardware workflows outside sandbox",
        )
    - name: dfu-util
      rule: |
        prefix_rule(
            pattern = ["dfu-util"],
            decision = "allow",
            justification = "Allow DFU hardware workflows outside sandbox",
        )
    - name: picocom
      rule: |
        prefix_rule(
            pattern = ["picocom"],
            decision = "allow",
            justification = "Allow serial console hardware workflows outside sandbox",
        )
    - name: stty
      rule: |
        prefix_rule(
            pattern = ["stty"],
            decision = "allow",
            justification = "Allow serial TTY configuration outside sandbox",
        )
    - name: st-flash
      rule: |
        prefix_rule(
            pattern = ["st-flash"],
            decision = "allow",
            justification = "Allow ST-Link flashing workflows outside sandbox",
        )
    - name: st-info
      rule: |
        prefix_rule(
            pattern = ["st-info"],
            decision = "allow",
            justification = "Allow ST-Link probe inspection outside sandbox",
        )
    - name: st-util
      rule: |
        prefix_rule(
            pattern = ["st-util"],
            decision = "allow",
            justification = "Allow ST-Link debug server workflows outside sandbox",
        )
  loop_control:
    label: "{{ item.name }}"

- name: Ensure Codex privileged command prompt rules
  blockinfile:
    path: "{{ user_home }}/.codex/rules/default.rules"
    create: true
    marker: "# {mark} ANSIBLE MANAGED CODEX PROMPT RULE {{ item.name }}"
    block: "{{ item.rule }}"
    mode: "0644"
  loop:
    - name: sudo
      rule: |
        prefix_rule(
            pattern = ["sudo"],
            decision = "prompt",
            justification = "Prompt before running commands with elevated privileges",
            match = ["sudo pacman -Syu"],
        )
    - name: git-push
      rule: |
        prefix_rule(
            pattern = ["git", "push"],
            decision = "prompt",
            justification = "Prompt before publishing commits to a remote repository",
            match = ["git push"],
        )
    - name: git-reset-hard
      rule: |
        prefix_rule(
            pattern = ["git", "reset", "--hard"],
            decision = "prompt",
            justification = "Prompt before discarding tracked workspace changes",
            match = ["git reset --hard HEAD"],
        )
    - name: git-clean
      rule: |
        prefix_rule(
            pattern = ["git", "clean"],
            decision = "prompt",
            justification = "Prompt before deleting untracked workspace files",
            match = ["git clean -fd"],
        )
    - name: git-restore
      rule: |
        prefix_rule(
            pattern = ["git", "restore"],
            decision = "prompt",
            justification = "Prompt before restoring files and discarding local edits",
            match = ["git restore README.md"],
        )
    - name: git-checkout-restore
      rule: |
        prefix_rule(
            pattern = ["git", "checkout", "--"],
            decision = "prompt",
            justification = "Prompt before checkout restores files and discards local edits",
            match = ["git checkout -- README.md"],
        )
    - name: git-rebase
      rule: |
        prefix_rule(
            pattern = ["git", "rebase"],
            decision = "prompt",
            justification = "Prompt before rewriting local history",
            match = ["git rebase main"],
        )
    - name: doas
      rule: |
        prefix_rule(
            pattern = ["doas"],
            decision = "prompt",
            justification = "Prompt before running commands with elevated privileges",
            match = ["doas apk update"],
        )
    - name: su
      rule: |
        prefix_rule(
            pattern = ["su"],
            decision = "prompt",
            justification = "Prompt before switching users or running a root shell",
            match = ["su -"],
        )
    - name: apt
      rule: |
        prefix_rule(
            pattern = ["apt"],
            decision = "prompt",
            justification = "Prompt before system package changes with apt",
            match = ["apt install ripgrep"],
        )
    - name: apt-get
      rule: |
        prefix_rule(
            pattern = ["apt-get"],
            decision = "prompt",
            justification = "Prompt before system package changes with apt-get",
            match = ["apt-get install ripgrep"],
        )
    - name: dnf
      rule: |
        prefix_rule(
            pattern = ["dnf"],
            decision = "prompt",
            justification = "Prompt before system package changes with dnf",
            match = ["dnf install ripgrep"],
        )
    - name: pacman
      rule: |
        prefix_rule(
            pattern = ["pacman"],
            decision = "prompt",
            justification = "Prompt before system package changes with pacman",
            match = ["pacman -Syu"],
        )
    - name: yay
      rule: |
        prefix_rule(
            pattern = ["yay"],
            decision = "prompt",
            justification = "Prompt before AUR package changes with yay",
            match = ["yay -S visual-studio-code-bin"],
        )
    - name: brew-install
      rule: |
        prefix_rule(
            pattern = ["brew", "install"],
            decision = "prompt",
            justification = "Prompt before installing Homebrew packages",
            match = ["brew install ripgrep"],
        )
    - name: brew-upgrade
      rule: |
        prefix_rule(
            pattern = ["brew", "upgrade"],
            decision = "prompt",
            justification = "Prompt before upgrading Homebrew packages",
            match = ["brew upgrade"],
        )
    - name: rustup
      rule: |
        prefix_rule(
            pattern = ["rustup"],
            decision = "prompt",
            justification = "Prompt before modifying Rust toolchains or global components",
            match = ["rustup update stable"],
        )
    - name: cargo-install
      rule: |
        prefix_rule(
            pattern = ["cargo", "install"],
            decision = "prompt",
            justification = "Prompt before installing or replacing global Cargo binaries",
            match = ["cargo install cargo-nextest"],
        )
    - name: uv-tool-install
      rule: |
        prefix_rule(
            pattern = ["uv", "tool", "install"],
            decision = "prompt",
            justification = "Prompt before installing global uv tools",
            match = ["uv tool install ruff"],
        )
    - name: uv-tool-upgrade
      rule: |
        prefix_rule(
            pattern = ["uv", "tool", "upgrade"],
            decision = "prompt",
            justification = "Prompt before upgrading global uv tools",
            match = ["uv tool upgrade ruff"],
        )
    - name: npm-install-global-short
      rule: |
        prefix_rule(
            pattern = ["npm", "install", "-g"],
            decision = "prompt",
            justification = "Prompt before installing or replacing global npm packages",
            match = ["npm install -g @openai/codex"],
        )
    - name: npm-install-global-long
      rule: |
        prefix_rule(
            pattern = ["npm", "install", "--global"],
            decision = "prompt",
            justification = "Prompt before installing or replacing global npm packages",
            match = ["npm install --global @openai/codex"],
        )
    - name: python-pip-install
      rule: |
        prefix_rule(
            pattern = ["python", "-m", "pip", "install"],
            decision = "prompt",
            justification = "Prompt before installing packages into the active Python environment",
            match = ["python -m pip install pytest"],
        )
    - name: python3-pip-install
      rule: |
        prefix_rule(
            pattern = ["python3", "-m", "pip", "install"],
            decision = "prompt",
            justification = "Prompt before installing packages into the active Python environment",
            match = ["python3 -m pip install pytest"],
        )
    - name: pipx-install
      rule: |
        prefix_rule(
            pattern = ["pipx", "install"],
            decision = "prompt",
            justification = "Prompt before installing global pipx applications",
            match = ["pipx install poetry"],
        )
    - name: systemctl
      rule: |
        prefix_rule(
            pattern = ["systemctl"],
            decision = "prompt",
            justification = "Prompt before changing or inspecting systemd services outside the sandbox",
            match = ["systemctl restart sshd"],
        )
    - name: mount
      rule: |
        prefix_rule(
            pattern = ["mount"],
            decision = "prompt",
            justification = "Prompt before mounting filesystems",
            match = ["mount /dev/sdb1 /mnt"],
        )
    - name: umount
      rule: |
        prefix_rule(
            pattern = ["umount"],
            decision = "prompt",
            justification = "Prompt before unmounting filesystems",
            match = ["umount /mnt"],
        )
  loop_control:
    label: "{{ item.name }}"

- name: Create Codex permissions example if missing
  copy:
    dest: "{{ user_home }}/.codex/config.permissions.example.toml"
    force: true
    mode: "0644"
    content: |
      # Example only. Copy selected settings to ~/.codex/config.toml when needed.
      model = "gpt-5.6-sol"
      model_reasoning_effort = "high"
      service_tier = "default"
      sandbox_mode = "workspace-write"
      approval_policy = "on-request"
      approvals_reviewer = "user"
      check_for_update_on_startup = true

      [apps._default]
      default_tools_approval_mode = "writes"
      destructive_enabled = false
      open_world_enabled = false
      approvals_reviewer = "user"

      [sandbox_workspace_write]
      writable_roots = [
        "/home/alexander/example"
      ]

- name: Create Codex CLI profile files
  copy:
    dest: "{{ user_home }}/.codex/{{ item.name }}.config.toml"
    force: true
    mode: "0644"
    content: |
      # Managed by firstboot. Use with: codex --profile {{ item.name }}
      model = "{{ item.model }}"
      model_reasoning_effort = "{{ item.reasoning_effort }}"
      service_tier = "{{ codex_service_tier | default('default') }}"
      sandbox_mode = "{{ codex_sandbox_mode | default('workspace-write') }}"
      approval_policy = "{{ codex_approval_policy | default('on-request') }}"
      approvals_reviewer = "{{ codex_approvals_reviewer | default('user') }}"
      {% if item.name == 'lean' %}
      web_search = "cached"
      {% endif %}

      {% if item.name == 'deep' %}

      [apps._default]
      default_tools_approval_mode = "{{ codex_apps_default_tools_approval_mode | default('writes') }}"
      destructive_enabled = false
      open_world_enabled = false
      approvals_reviewer = "{{ codex_approvals_reviewer | default('user') }}"
      {% endif %}
  loop:
    - name: lean
      model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
      reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
    - name: deep
      model: "{{ codex_deep_profile_model | default(codex_model | default('gpt-5.6-sol')) }}"
      reasoning_effort: "{{ codex_deep_profile_reasoning_effort | default(codex_model_reasoning_effort | default('high')) }}"
  loop_control:
    label: "{{ item.name }}"
  when: codex_profiles_enabled | default(true) | bool

- name: Remove managed Codex CLI profile files when disabled
  file:
    path: "{{ user_home }}/.codex/{{ item }}.config.toml"
    state: absent
  loop:
    - lean
    - deep
  when: not (codex_profiles_enabled | default(true) | bool)

- name: Ensure Codex custom agents directory exists
  file:
    path: "{{ user_home }}/.codex/agents"
    state: directory

- name: Set Codex custom agent definitions
  set_fact:
    codex_custom_agent_definitions:
      - name: explorer-terra
        description: Fast read-only repository exploration and large-file evidence gathering.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Scout", "Mapper", "Triage"'
        instructions: |
          You are a read-only exploration agent. Inspect files, logs, docs, and command output. Do not edit files. Return only decision-relevant findings with file paths, commands used, and uncertainty where evidence is incomplete.
      - name: reviewer-deep
        description: High-reasoning code review focused on bugs, regressions, security risks, and test gaps.
        model: "{{ codex_model | default('gpt-5.6-sol') }}"
        reasoning_effort: "{{ codex_model_reasoning_effort | default('high') }}"
        sandbox_mode: read-only
        nicknames: '"Reviewer", "Auditor", "Skeptic"'
        instructions: |
          You are a read-only review agent. Prioritize concrete bugs, behavioral regressions, security risks, and missing tests. Cite exact files and lines when possible. Avoid style-only findings unless they block maintainability or correctness.
      - name: docs-researcher
        description: Targeted documentation research for current APIs, SDKs, frameworks, and platform behavior.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Researcher", "Librarian", "Verifier"'
        instructions: |
          You are a documentation research agent. Prefer official docs and configured documentation MCP servers. Return concise guidance with source links, version assumptions, and any gaps that need verification before implementation.
      - name: tester-terra
        description: Fast build, lint, typecheck, and test runner that reports focused failures without editing source.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: workspace-write
        nicknames: '"Runner", "Verifier", "Harness"'
        instructions: |
          You are a verification agent. Run focused build, lint, typecheck, and test commands requested by the parent thread. You may create normal build/test artifacts in the workspace, but do not edit source files. Return commands, exit codes, concise failure summaries, and likely next investigation targets.
      - name: architect-deep
        description: High-reasoning architecture and migration analyst for ambiguous cross-module design decisions.
        model: "{{ codex_model | default('gpt-5.6-sol') }}"
        reasoning_effort: "{{ codex_model_reasoning_effort | default('high') }}"
        sandbox_mode: read-only
        nicknames: '"Architect", "Planner", "Strategist"'
        instructions: |
          You are a read-only architecture agent. Analyze constraints, coupling, data flow, rollout risk, and tradeoffs. Do not edit files. Return a concise recommendation, alternatives rejected, and concrete files or interfaces that constrain the design.
      - name: knowledge-curator
        description: Read-only project knowledge curator that proposes durable skills or documentation after non-trivial work.
        model: "{{ codex_lean_profile_model | default('gpt-5.6-terra') }}"
        reasoning_effort: "{{ codex_lean_profile_reasoning_effort | default('medium') }}"
        sandbox_mode: read-only
        nicknames: '"Curator", "Archivist", "Analyst"'
        instructions: |
          You are a read-only knowledge-curation agent. Inspect recent diffs, command results, failure modes, and successful fixes. Do not edit files or create skills. Return only reusable, evidence-backed knowledge-capture candidates using this format:
          Candidate: short title
          Evidence: files, commands, errors, or artifacts that prove this was useful
          Reuse Trigger: when future Codex sessions should remember this
          Recommended Target: skill, AGENTS.md, README, or no action
          Draft Guidance: 3-6 lines of reusable instruction

- name: Remove disabled managed Codex custom agents
  file:
    path: "{{ user_home }}/.codex/agents/{{ item.name }}.toml"
    state: absent
  loop: "{{ codex_custom_agent_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  when: >-
    not (codex_custom_agents_enabled | default(true) | bool)
    or item.name not in (codex_custom_agents | default([]))

- name: Create Codex custom agents
  copy:
    dest: "{{ user_home }}/.codex/agents/{{ item.name }}.toml"
    force: true
    mode: "0644"
    content: |
      # Managed by firstboot.
      name = "{{ item.name }}"
      description = "{{ item.description }}"
      model = "{{ item.model }}"
      model_reasoning_effort = "{{ item.reasoning_effort }}"
      sandbox_mode = "{{ item.sandbox_mode }}"
      nickname_candidates = [{{ item.nicknames }}]

      developer_instructions = '''
      {{ item.instructions }}
      '''
  loop: "{{ codex_custom_agent_definitions }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - codex_custom_agents_enabled | default(true) | bool
    - item.name in (codex_custom_agents | default([]))

