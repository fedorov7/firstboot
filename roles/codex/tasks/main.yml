    follow: false
  register: codex_claude_skills_namespace

- name: Remove incompatible Codex claude-skills namespace
  file:
    path: "{{ user_home }}/.agents/skills/claude-skills"
    state: absent
  when:
    - codex_claude_skills_namespace.stat.exists
    - not (codex_claude_skills_namespace.stat.isdir | default(false))

- name: Ensure Codex claude-skills namespace directory exists
  file:
    path: "{{ user_home }}/.agents/skills/claude-skills"
    state: directory

- name: Find existing Codex claude-skills skill entries
  find:
    paths: "{{ user_home }}/.agents/skills/claude-skills"
    file_type: any
    recurse: false
  register: codex_claude_skills_existing

- name: Remove stale Codex claude-skills
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ codex_claude_skills_existing.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (codex_claude_skills | default([]))

- name: Check selected Codex claude-skills exist
  stat:
    path: "{{ user_home }}/.local/share/codex/skill-sources/claude-skills/skills/{{ item }}"
  register: codex_claude_skills_checks
  loop: "{{ codex_claude_skills | default([]) }}"

- name: Fail if selected Codex claude-skill is missing
  fail:
    msg: "Selected claude-skill '{{ item.item }}' was not found in the cloned source repo."
  loop: "{{ codex_claude_skills_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.stat.isdir | default(false))

- name: Symlink selected Codex claude-skills
  file:
    src: "{{ user_home }}/.local/share/codex/skill-sources/claude-skills/skills/{{ item }}"
    dest: "{{ user_home }}/.agents/skills/claude-skills/{{ item }}"
    state: link
    force: true
  loop: "{{ codex_claude_skills | default([]) }}"

# ── Skills: Karpathy guidelines (clone source + symlink allowlist) ──

- name: Clone Karpathy guidelines skills repo
  git:
    repo: https://github.com/forrestchang/andrej-karpathy-skills.git
    dest: "{{ user_home }}/.local/share/codex/skill-sources/karpathy-skills"
    update: true
  when: (codex_karpathy_skills | default([]) | length) > 0

- name: Stat Codex Karpathy guidelines namespace
  stat:
    path: "{{ user_home }}/.agents/skills/karpathy-skills"
    follow: false
  register: codex_karpathy_skills_namespace

- name: Remove incompatible Codex Karpathy guidelines namespace
  file:
    path: "{{ user_home }}/.agents/skills/karpathy-skills"
    state: absent
  when:
    - codex_karpathy_skills_namespace.stat.exists
    - not (codex_karpathy_skills_namespace.stat.isdir | default(false))

- name: Ensure Codex Karpathy guidelines namespace directory exists
  file:
    path: "{{ user_home }}/.agents/skills/karpathy-skills"
    state: directory

- name: Find existing Codex Karpathy guidelines skill entries
  find:
    paths: "{{ user_home }}/.agents/skills/karpathy-skills"
    file_type: any
    recurse: false
  register: codex_karpathy_skills_existing

- name: Remove stale Codex Karpathy guidelines skills
  file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ codex_karpathy_skills_existing.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (codex_karpathy_skills | default([]))

- name: Check selected Codex Karpathy guidelines skills exist
  stat:
    path: "{{ user_home }}/.local/share/codex/skill-sources/karpathy-skills/skills/{{ item }}"
  register: codex_karpathy_skills_checks
  loop: "{{ codex_karpathy_skills | default([]) }}"

- name: Fail if selected Codex Karpathy guidelines skill is missing
  fail:
    msg: "Selected Karpathy guidelines skill '{{ item.item }}' was not found in the cloned source repo."
  loop: "{{ codex_karpathy_skills_checks.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: not (item.stat.isdir | default(false))

- name: Symlink selected Codex Karpathy guidelines skills
  file:
    src: "{{ user_home }}/.local/share/codex/skill-sources/karpathy-skills/skills/{{ item }}"
    dest: "{{ user_home }}/.agents/skills/karpathy-skills/{{ item }}"
    state: link
    force: true
  loop: "{{ codex_karpathy_skills | default([]) }}"
