- name: Harden Codex MCP server settings
  shell: |
    config_toml="{{ user_home }}/.codex/config.toml"
    section="[mcp_servers.{{ item.name }}]"
    key="{{ item.key }}"
    value={{ item.value | quote }}
    if [[ ! -f "$config_toml" ]]; then
      exit 0
    fi
    if ! grep -qF "$section" "$config_toml"; then
      exit 0
    fi
    current_block="$(awk -v section="$section" '
      $0 == section { in_section = 1; next }
      in_section && /^\[/ { exit }
      in_section { print }
    ' "$config_toml")"
    if [[ "$current_block" == *"$key = $value"* ]]; then
      exit 0
    fi
    temp_config="$(mktemp)"
    awk -v section="$section" -v key="$key" -v value="$value" '
      BEGIN { in_section = 0; seen = 0 }
      $0 == section { in_section = 1; print; next }
      in_section && /^\[/ {
        if (!seen) {
          print key " = " value
          seen = 1
        }
        in_section = 0
      }
      in_section && $0 ~ "^" key " = " {
        if (!seen) {
          print key " = " value
          seen = 1
        }
        next
      }
      { print }
      END {
        if (in_section && !seen) {
          print key " = " value
        }
      }
    ' "$config_toml" >"$temp_config"
    python3 -c 'import pathlib, sys, tomllib; tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))' "$temp_config"
    cp "$temp_config" "$config_toml"
    rm -f "$temp_config"
    echo "OK: $section $key"
  args:
    executable: /bin/bash
  register: codex_mcp_hardening
  changed_when: "'OK:' in codex_mcp_hardening.stdout"
  loop:
    - name: context7
      key: startup_timeout_sec
      value: "30"
    - name: context7
      key: enabled
      value: "{{ ('context7' not in (codex_mcp_default_disabled_servers | default(['context7', 'memory', 'fetch', 'sequential-thinking']))) | ternary('true', 'false') }}"
    - name: openaiDeveloperDocs
      key: startup_timeout_sec
      value: "30"
    - name: microsoft-learn
      key: startup_timeout_sec
      value: "30"
    - name: memory
      key: enabled
      value: "{{ ('memory' not in (codex_mcp_default_disabled_servers | default(['context7', 'memory', 'fetch', 'sequential-thinking']))) | ternary('true', 'false') }}"
    - name: fetch
      key: startup_timeout_sec
      value: "30"
    - name: fetch
      key: enabled
      value: "{{ ('fetch' not in (codex_mcp_default_disabled_servers | default(['context7', 'memory', 'fetch', 'sequential-thinking']))) | ternary('true', 'false') }}"
    - name: fetch
      key: default_tools_approval_mode
      value: '"{{ codex_fetch_mcp_approval_mode | default(''prompt'') }}"'
    - name: sequential-thinking
      key: enabled
      value: "{{ ('sequential-thinking' not in (codex_mcp_default_disabled_servers | default(['context7', 'memory', 'fetch', 'sequential-thinking']))) | ternary('true', 'false') }}"
    - name: microsoft-learn
      key: default_tools_approval_mode
      value: '"{{ codex_microsoft_learn_mcp_approval_mode | default(''writes'') }}"'
    - name: github
      key: default_tools_approval_mode
      value: '"{{ codex_github_mcp_approval_mode | default(''writes'') }}"'
    - name: serena
      key: default_tools_approval_mode
      value: '"{{ codex_serena_mcp_approval_mode | default(''writes'') }}"'
    - name: playwright
      key: startup_timeout_sec
      value: "30"
    - name: playwright
      key: default_tools_approval_mode
      value: '"{{ codex_playwright_mcp_approval_mode | default(''prompt'') }}"'
  loop_control:
    label: "{{ item.name }} {{ item.key }}"

