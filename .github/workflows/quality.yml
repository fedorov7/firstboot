---
name: Quality

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  policy-and-syntax:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install ansible-core

      - name: Run shell policy tests
        run: |
          bash tests/shell/test_macos_bootstrap_syntax.sh
          bash tests/shell/test_policy_hardening.sh

      - name: Run PowerShell policy tests
        shell: pwsh
        run: |
          foreach ($test in Get-ChildItem tests/powershell/*.ps1) {
            & $test.FullName
          }

      - name: Check Ansible syntax
        run: ansible-playbook site.yml --syntax-check
